name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-demo:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-demo:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            echo "Pulling latest Docker image..."

            docker pull ${{ secrets.DOCKER_USERNAME }}/flask-demo:latest

            echo "Stopping old container..."

            docker stop flask-demo || true

            echo "Removing old container..."

            docker rm flask-demo || true

            echo "Starting new container..."

            docker run -d \
              --name flask-demo \
              --restart unless-stopped \
              -p 5001:5001 \
              ${{ secrets.DOCKER_USERNAME }}/flask-demo:latest

            echo "Deployment completed!"